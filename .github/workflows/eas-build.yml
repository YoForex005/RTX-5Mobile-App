name: RTX5 EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: preview
        type: choice
        options:
          - development
          - preview
          - staging
          - production
          - production-apk
      platform:
        description: "Build platform"
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios
  pull_request:
    branches:
      - main
      - staging
      - release
    paths:
      - "rtx5-app/**"
      - ".github/workflows/eas-build.yml"

permissions:
  contents: read

concurrency:
  group: eas-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  WORKING_DIR: rtx5-app

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.WORKING_DIR }}

      - name: TypeScript check
        run: npm run typecheck
        working-directory: ${{ env.WORKING_DIR }}

      - name: Expo doctor
        run: npx --yes expo-doctor
        working-directory: ${{ env.WORKING_DIR }}

  build:
    name: EAS Build (${{ inputs.profile }} / ${{ inputs.platform }})
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.WORKING_DIR }}

      - name: Build
        run: >
          eas build
          --platform "${{ inputs.platform }}"
          --profile "${{ inputs.profile }}"
          --non-interactive
        working-directory: ${{ env.WORKING_DIR }}
