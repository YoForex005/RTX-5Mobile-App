          type: integer
        reported_accounts:
          type: integer
        reported_active_accounts:
          type: integer
        reported_deals:
          type: integer
          format: int64
        reported_volume:
          type: number
          format: double
        server_version:
          type: string
        ip:
          type: string
        timestamp:
          type: integer
          format: int64

    BrokerUsage:
      type: object
