          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v2/accounts/{login}/credit:
    post:
      operationId: creditIn
      tags: [Accounts]
      summary: Apply credit to an account
      description: |
        **Requires admin or manager role.** Traders use payment_requests workflow instead.
        Uses a DB transaction for atomicity. Amount must be non-zero and cannot exceed 1,000,000 in absolute value.
      parameters:
        - name: login
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
                  format: double
                comment:
                  type: string
      responses:
