      parameters:
        - name: broker_id
          in: query
          required: true
          schema:
            type: integer
        - name: period
          in: query
          schema:
            type: string
            default: day
            enum: [hour, day, week, month]
      responses:
        "200":
          description: Volume metrics grouped by period
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VolumeMetric"

