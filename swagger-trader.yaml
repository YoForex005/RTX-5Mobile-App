          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: to
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Latency percentiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatencyMetrics"

  /logging/v1/metrics/volume:
    get:
      operationId: auditGetVolumeMetrics
