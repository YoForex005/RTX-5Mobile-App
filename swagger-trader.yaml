  /api/v2/accounts/{login}/deposit:
    post:
      operationId: depositFunds
      tags: [Accounts]
      summary: Deposit funds into an account
      description: |
        **Requires admin or manager role.** Traders use payment_requests workflow instead.
        Uses a DB transaction for atomicity. Amount must be positive and cannot exceed 1,000,000.
      parameters:
        - name: login
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
                  format: double
                comment:
                  type: string
      responses:
        "200":
          description: Deposit successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceOp"
        "400":
          description: Invalid amount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v2/accounts/{login}/withdraw:
    post:
      operationId: withdrawFunds
      tags: [Accounts]
      summary: Withdraw funds from an account
      description: |
        **Requires admin or manager role.** Traders use payment_requests workflow instead.
        Uses a DB transaction for atomicity. Amount must be positive and cannot exceed 1,000,000.
      parameters:
        - name: login
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
                  format: double
                comment:
                  type: string
      responses:
