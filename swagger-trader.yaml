                    type: string
                    description: Full webhook URL to configure in TradingView
                  created_at:
                    type: integer
                    format: int64

# =============================================================================
# COMPONENTS
# =============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /api/v2/auth/login
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key obtained during registration
    AdminApiKey:
      type: apiKey
      in: header
      name: X-Admin-API-Key
      description: RTX5 admin API key for License Server operations

  schemas:
    # --- Common ---
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid request parameters

    # --- Auth ---
    AuthTokenResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        refresh_token:
          type: string
