  /api/v2/positions/{login}/history:
    get:
      operationId: getPositionHistory
      tags: [Trading]
      summary: Get closed position history for an account
      description: |
        Requires account ownership verification. Returns 404 if the account is not owned by the authenticated user.
      parameters:
        - name: login
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Position history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClosedPosition"

  /api/v2/deals/{login}:
    get:
      operationId: getDeals
      tags: [Trading]
      summary: Get deal history for an account
      parameters:
        - name: login
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Deal history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deal"

  /api/v2/orders:
    post:
      operationId: placeOrder
      tags: [Trading]
      summary: Place a market order
      description: |
        The account_login must belong to the authenticated user.
        Rate limited: 60 requests per minute per account.
        Uses a DB transaction for atomicity. Rejected if market data returns zero or negative prices.
        SL/TP values (if provided) are validated against the current market price.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, symbol, side, volume]
              properties:
                login:
                  type: integer
                  format: int64
                symbol:
                  type: string
                side:
                  type: string
                  enum: [buy, sell]
                volume:
                  type: number
                  format: double
                price_sl:
                  type: number
                  format: double
                price_tp:
                  type: number
                  format: double
                comment:
                  type: string
                trailing_stop:
                  type: integer
                  description: Trailing stop distance in points
                trailing_step:
                  type: integer
                  description: Trailing step in points
                magic:
                  type: integer
                  format: int64
                  description: EA magic number
      responses:
        "200":
          description: Order executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Position"
        "400":
          description: Order rejected — invalid SL/TP (validated against current market price), zero/negative market price, or invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited — too many requests. Check Retry-After header.

  /api/v2/positions/{id}/close:
    post:
      operationId: closePosition
      tags: [Trading]
      summary: Close a specific position by ticket
      description: |
        The position must belong to an account owned by the authenticated user.
        Uses a DB transaction for atomicity. Rejected if market data returns zero or negative prices.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Position closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"
        "404":
          description: Position not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited — too many requests. Check Retry-After header.

  /api/v2/positions/{id}:
    put:
      operationId: modifyPosition
      tags: [Trading]
      summary: Modify SL/TP of an open position
      description: |
        Requires account ownership. Returns 404 if the position is not owned by the authenticated user.
        SL/TP values are validated against the current market price (not the position open price).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                price_sl:
                  type: number
                  format: double
                price_tp:
                  type: number
                  format: double
                trailing_stop:
                  type: integer
                  description: Trailing stop distance in points
                trailing_step:
                  type: integer
                  description: Trailing step in points
      responses:
        "200":
          description: Position modified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Position"
        "400":
          description: Invalid SL/TP — values are validated against current market price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Position not found or not owned by authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v2/orders/{login}:
    get:
      operationId: getOrders
      tags: [Trading]
      summary: Get order history for an account
      description: |
        Returns only orders for accounts owned by the authenticated user. Returns 404 if the account is not owned by the authenticated user.
      parameters:
        - name: login
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Order history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  # ===========================================================================
  # CORE GATEWAY — Pending Orders (port 8090)
  # ===========================================================================
  /api/v2/orders/pending:
    post:
      operationId: placePendingOrder
      tags: [Pending Orders]
      summary: Place a pending (limit/stop) order
      description: |
        Requires ownership of the specified account. Returns 404 if the account is not owned by the authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, symbol, side, volume, type, price]
              properties:
                login:
                  type: integer
                  format: int64
                symbol:
                  type: string
                side:
                  type: string
                  enum: [buy, sell]
                volume:
                  type: number
                  format: double
                type:
                  type: string
                  enum: [buy_limit, sell_limit, buy_stop, sell_stop]
                price:
                  type: number
                  format: double
                price_sl:
                  type: number
                  format: double
                price_tp:
                  type: number
                  format: double
                expiration:
                  type: integer
                  format: int64
                  description: Unix timestamp for order expiration
                comment:
                  type: string
                trailing_stop:
                  type: integer
