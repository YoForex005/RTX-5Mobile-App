  # ===========================================================================

  /history/candles/{symbol}:
    get:
      operationId: historyGetCandles
      tags: ["History: Candles"]
      summary: Get historical candles for a symbol
      security: []
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            example: XAUUSD
        - name: tf
          in: query
          required: false
          description: "Timeframe: M1, M5, M15, M30, H1, H4, D1, W1, MN"
          schema:
            type: string
            default: H1
            enum: [M1, M5, M15, M30, H1, H4, D1, W1, MN]
        - name: from
          in: query
          schema:
            type: integer
            format: int64
          description: Unix timestamp start
        - name: to
          in: query
          schema:
            type: integer
            format: int64
          description: Unix timestamp end
        - name: count
          in: query
          schema:
            type: integer
            default: 500
            maximum: 5000
          description: Number of candles to return
      responses:
        "200":
          description: Array of OHLCV candles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryCandle"
        "400":
          $ref: "#/components/responses/BadRequest"

  /history/candles/{symbol}/latest:
    get:
      operationId: historyGetLatestCandle
      tags: ["History: Candles"]
      summary: Get the most recent candle for a symbol
      security: []
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            example: EURUSD
        - name: tf
          in: query
          schema:
            type: string
            default: H1
            enum: [M1, M5, M15, M30, H1, H4, D1, W1, MN]
      responses:
        "200":
          description: Latest candle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryCandle"
        "404":
          $ref: "#/components/responses/NotFound"

  /history/candles/batch:
    post:
      operationId: historyGetBatchCandles
      tags: ["History: Candles"]
      summary: Fetch candles for multiple symbols in one request
      description: Terminal uses this on startup to load all watchlist charts simultaneously. Max 10 symbols.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 10
              items:
                type: object
                required: [symbol, tf, count]
                properties:
                  symbol:
                    type: string
                    example: XAUUSD
                  tf:
                    type: string
                    enum: [M1, M5, M15, M30, H1, H4, D1, W1, MN]
                    example: H1
                  count:
                    type: integer
                    example: 500
      responses:
        "200":
          description: Map of symbol to candle arrays
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: "#/components/schemas/HistoryCandle"

  /history/ticks/{symbol}:
    get:
      operationId: historyGetTicks
      tags: ["History: Ticks"]
      summary: Get raw tick data for a symbol
      description: Used by strategy tester and tick replay. Max 10000 ticks per request.
      security: []
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            example: XAUUSD
        - name: from
          in: query
          required: true
          schema:
            type: integer
            format: int64
          description: Unix timestamp start
        - name: to
          in: query
          required: true
          schema:
            type: integer
            format: int64
          description: Unix timestamp end
        - name: limit
          in: query
          schema:
            type: integer
            default: 5000
            maximum: 10000
      responses:
        "200":
          description: Array of raw ticks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryTick"
        "400":
          $ref: "#/components/responses/BadRequest"

  /history/stats/{symbol}:
    get:
      operationId: historyGetStats
      tags: ["History: Stats"]
      summary: Get data coverage statistics for a symbol
      description: Used by terminal to know how far back it can scroll.
      security: []
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            example: XAUUSD
      responses:
        "200":
          description: Data coverage info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryStats"

  /history/generate/{symbol}:
    post:
      operationId: historyGenerateCandles
      tags: ["History: Admin"]
      summary: Trigger candle generation from raw ticks
      description: Admin only. Generates candles for a symbol from stored ticks.
      security: []
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            example: XAUUSD
        - name: days
          in: query
          schema:
            type: integer
            default: 90
        - name: tf
          in: query
          schema:
            type: string
            default: M1
            enum: [M1, M5, M15, M30, H1, H4, D1, W1, MN]
      responses:
        "200":
          description: Generation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  timeframe:
                    type: string
                  candles_generated:
                    type: integer
                  message:
                    type: string

  /ws/history:
    get:
      operationId: historyWebSocket
      tags: ["History: WebSocket"]
      summary: WebSocket for live candle updates
      description: |
        Subscribe to real-time candle updates via WebSocket.

        **Client → Server messages:**
        ```json
        {"action": "subscribe", "symbol": "XAUUSD", "tf": "H1"}
        {"action": "unsubscribe", "symbol": "XAUUSD", "tf": "H1"}
        ```

        **Server → Client messages:**
        ```json
        {"type": "candle_close", "symbol": "XAUUSD", "tf": "H1", "candle": {...}}
        {"type": "candle_update", "symbol": "XAUUSD", "tf": "H1", "candle": {...}}
        ```
      servers:
        - url: ws://69.197.178.27
          description: RTX5 WebSocket
      security: []
      responses:
        "101":
          description: WebSocket upgrade

  # ---------------------------------------------------------------------------
  # History Backend — Dukascopy Fetcher API (port 8098)
  # Downloads free historical tick/candle data from Dukascopy and stores in TimescaleDB
  # ---------------------------------------------------------------------------

  /history/api/v1/symbols:
    get:
      operationId: dukascopySymbols
      tags: ["History: Admin"]
      summary: List all 1,607 mapped symbols with Dukascopy IDs
      description: |
        Returns all RTX5 symbols mapped to Dukascopy instrument identifiers.
        Filter by category: forex, metals, indices, energy, crypto, bonds.
      security: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [forex, metals, indices, energy, crypto, bonds]
          description: Filter by asset category
      responses:
        "200":
          description: Symbol catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 1607
                  categories:
                    type: array
                    items: {type: string}
                    example: [forex, metals, indices, energy, crypto, bonds]
                  symbols:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol: {type: string, example: "EURUSD"}
                        dukascopy: {type: string, example: "eurusd"}
                        digits: {type: integer, example: 5}
                        category: {type: string, example: "forex"}
                        description: {type: string, example: "Euro vs US Dollar"}

  /history/api/v1/timeframes:
    get:
      operationId: dukascopyTimeframes
      tags: ["History: Admin"]
      summary: List supported timeframes
      security: []
      responses:
        "200":
          description: Available timeframes
          content:
            application/json:
              schema:
                type: array
                items: {type: string}
                example: [tick, M1, M5, M15, M30, H1, H4, D1, MN1]

  /history/api/v1/download:
    post:
      operationId: dukascopyDownload
      tags: ["History: Admin"]
      summary: Start a historical data download from Dukascopy
      description: |
        Downloads tick or candle data from Dukascopy's free public data source.
        Large date ranges are automatically chunked to avoid memory issues.
        The download runs in the background — check /api/v1/jobs for progress.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, timeframe, from, to]
              properties:
                symbol:
                  type: string
                  description: "RTX5 symbol (e.g. EURUSD, XAUUSD, BTCUSD)"
                  example: EURUSD
                timeframe:
                  type: string
                  enum: [tick, M1, M5, M15, M30, H1, H4, D1, MN1]
                  example: H1
                from:
                  description: ISO date or unix timestamp
                  example: "2024-01-01"
                to:
                  description: ISO date or unix timestamp
                  example: "2024-12-31"
      responses:
        "200":
          description: Download started
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: {type: string}
                  symbol: {type: string}
                  timeframe: {type: string}
                  from: {type: string, format: date-time}
                  to: {type: string, format: date-time}
                  status: {type: string, example: "started"}

  /history/api/v1/download/all:
    post:
      operationId: dukascopyDownloadAll
      tags: ["History: Admin"]
      summary: Download all 1,607 symbols for a timeframe
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timeframe, from, to]
              properties:
                timeframe: {type: string, enum: [tick, M1, M5, M15, M30, H1, H4, D1, MN1]}
                from: {description: ISO date or unix timestamp}
                to: {description: ISO date or unix timestamp}
      responses:
        "200":
          description: Bulk download started
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbols: {type: integer, example: 1607}
                  timeframe: {type: string}
                  jobs:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol: {type: string}
                        jobId: {type: string}
                        status: {type: string}

  /history/api/v1/catchup:
    post:
      operationId: dukascopyCatchup
      tags: ["History: Admin"]
      summary: Catch up all symbols to present time
      description: |
        For each symbol, finds the latest data stored and downloads from there to now.
        Useful after server downtime to fill gaps.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timeframe: {type: string, default: H1}
      responses:
        "200":
          description: Catch-up started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: "started"}
                  timeframe: {type: string}
                  symbols: {type: integer}

  /history/api/v1/jobs:
    get:
      operationId: dukascopyJobs
      tags: ["History: Admin"]
      summary: List active download jobs
      security: []
      responses:
        "200":
          description: Active jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    key: {type: string, example: "EURUSD:H1"}
                    jobId: {type: string}

  /history/api/v1/status:
    get:
      operationId: dukascopyStatus
      tags: ["History: Stats"]
      summary: Data availability summary for all symbols
      security: []
      parameters:
        - name: timeframe
          in: query
          schema: {type: string, default: H1}
      responses:
        "200":
          description: Availability per symbol
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    symbol: {type: string}
                    timeframe: {type: string}
                    earliest: {type: integer, format: int64, nullable: true}
                    earliestDate: {type: string, format: date-time, nullable: true}
                    latest: {type: integer, format: int64, nullable: true}
                    latestDate: {type: string, format: date-time, nullable: true}
                    gapSeconds: {type: integer, nullable: true}
                    upToDate: {type: boolean}

  /history/api/v1/status/{symbol}:
    get:
      operationId: dukascopyStatusSymbol
      tags: ["History: Stats"]
      summary: Detailed data availability for one symbol across all timeframes
      security: []
      parameters:
        - name: symbol
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Status per timeframe
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol: {type: string}
                  dukascopy: {type: string}
                  timeframes:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        earliest: {type: integer, format: int64, nullable: true}
                        latest: {type: integer, format: int64, nullable: true}
                        hasData: {type: boolean}

  /history/api/v1/gaps:
    get:
      operationId: dukascopyGaps
      tags: ["History: Stats"]
      summary: Find data gaps for a symbol and timeframe
      description: Detects periods where expected candles are missing (gap > 2x interval).
      security: []
      parameters:
        - name: symbol
          in: query
          required: true
          schema: {type: string}
        - name: timeframe
          in: query
          required: true
          schema: {type: string, enum: [M1, M5, M15, M30, H1, H4, D1]}
      responses:
        "200":
          description: Gap analysis
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol: {type: string}
                  timeframe: {type: string}
                  gapCount: {type: integer}
                  gaps:
                    type: array
                    items:
                      type: object
                      properties:
                        from: {type: integer, format: int64}
                        to: {type: integer, format: int64}
                        fromDate: {type: string, format: date-time}
                        toDate: {type: string, format: date-time}
                        missingSeconds: {type: integer}

  # ===========================================================================
  # LOGGING BACKEND — Audit Trail (port 8099)
  # ===========================================================================

  /logging/v1/audit:
    get:
      operationId: auditSearch
      tags: ["Audit: Search"]
      summary: Search audit log with filters
      description: Paginated audit log search accessible to broker managers with view_reports permission.
      security: []
      parameters:
        - name: broker_id
          in: query
          required: true
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: integer
            format: int64
          description: Unix timestamp start
        - name: to
          in: query
          schema:
            type: integer
            format: int64
          description: Unix timestamp end
        - name: actor_id
          in: query
          schema:
            type: string
          description: Filter by actor (login number, manager ID)
        - name: action
          in: query
          schema:
            type: string
          description: Filter by action (e.g. order_fill, deposit, position_flip)
        - name: target_type
          in: query
          schema:
            type: string
            enum: [account, position, order, deal]
        - name: target_id
          in: query
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: Paginated audit events
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"

  /logging/v1/audit/export:
    get:
      operationId: auditExport
      tags: ["Audit: Export"]
      summary: Export audit log as CSV for compliance
      security: []
      parameters:
        - name: broker_id
          in: query
          required: true
          schema:
            type: integer
        - name: from
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: to
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: format
          in: query
          schema:
            type: string
            default: csv
            enum: [csv]
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
          headers:
            Content-Disposition:
              schema:
                type: string
                example: "attachment; filename=audit_log_1_1700000000_1700100000.csv"

  /logging/v1/audit/search:
    get:
      operationId: auditFullTextSearch
      tags: ["Audit: Search"]
      summary: Full-text search across audit events
      security: []
      parameters:
        - name: broker_id
          in: query
          required: true
          schema:
            type: integer
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query (searches across action, actor_id, metadata)
        - name: from
          in: query
          schema:
            type: integer
            format: int64
        - name: to
          in: query
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Paginated search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"

  /logging/v1/metrics/latency:
