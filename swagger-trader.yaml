    LicenseSummary:
      type: object
      properties:
        status:
          type: string
          enum: [active, suspended, expired, grace_period]
        max_accounts:
          type: integer
        modules_enabled:
          type: array
          items:
            type: string
        valid_until:
          type: integer
          format: int64
          nullable: true

    # --- License Agent ---
    LicenseAgentStatus:
      type: object
      properties:
        status:
          type: string
          enum: [active, suspended, expired, grace_period]
        plan:
          type: string
        broker_id:
          type: integer
        broker_name:
          type: string
        max_accounts:
          type: integer
        current_accounts:
          type: integer
        max_instruments:
          type: integer
        max_managers:
          type: integer
        modules_enabled:
          type: array
          items:
            type: string
        valid_until:
          type: integer
          format: int64
          nullable: true

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
