            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /license/check/module/{module}:
    get:
      operationId: licenseAgentCheckModule
      tags: ["License: Agent"]
      summary: Check if a module is licensed
      description: Called by services before enabling premium features.
      servers:
        - url: http://127.0.0.1:8100
          description: License Agent (local)
      security: []
      parameters:
        - name: module
          in: path
          required: true
          schema:
            type: string
            example: prop_firm
            enum: [prop_firm, copy_trading, ib_system, bonus_system, analytics, compliance]
      responses:
        "200":
          description: Module is licensed
          content:
            application/json:
              schema:
                type: object
                properties:
                  module:
                    type: string
                  enabled:
                    type: boolean
        "403":
          description: Module not licensed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

