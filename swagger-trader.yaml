          type: integer
        current_active_accounts:
          type: integer
        total_deals_lifetime:
          type: integer
          format: int64
        total_volume_lifetime:
          type: number
          format: double
        last_heartbeat:
          type: integer
          format: int64

    DashboardStats:
      type: object
