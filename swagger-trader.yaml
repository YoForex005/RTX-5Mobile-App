      summary: Close all open positions for an account
      description: |
        Requires account ownership verification. Uses DB transactions for atomicity. Rejects closure if market data returns zero/negative prices.
      parameters:
        - name: login
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: All positions closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  closed:
                    type: integer
                  message:
                    type: string

  /api/v2/accounts/{login}/investor-password:
    post:
      operationId: setInvestorPassword
      tags: [Accounts]
      summary: Set investor (read-only) password for an account
      description: |
        Requires account ownership. Returns 404 if the account is not owned by the authenticated user.
      parameters:
        - name: login
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        "200":
          description: Investor password set
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

