<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Install RTX5</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        align-items: center;
        background: #111318;
        color: #f5f7fb;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        max-width: 420px;
        text-align: center;
      }

      h1 {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0;
        margin: 0 0 12px;
      }

      p {
        color: #b9c0cc;
        font-size: 16px;
        line-height: 1.5;
        margin: 0 0 22px;
      }

      a {
        align-items: center;
        background: #2f7cf6;
        border-radius: 8px;
        color: white;
        display: inline-flex;
        font-size: 17px;
        font-weight: 700;
        justify-content: center;
        min-height: 52px;
        padding: 0 22px;
        text-decoration: none;
      }

      small {
        color: #858e9f;
        display: block;
        font-size: 13px;
        line-height: 1.45;
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Install RTX5</h1>
      <p>If the install prompt does not appear automatically, tap the button below.</p>
      <a id="installLink" href="#">Install on iPhone</a>
      <small>This works only on iPhones included in the app provisioning profile.</small>
    </main>
    <script>
      const manifestUrl =
        "https://api.expo.dev/v2/projects/092a58db-dea9-469a-a383-f27300598812/builds/2a0f8e09-fd1f-4e0f-a8aa-158d327e50c9/manifest.plist";
      const installUrl =
        "itms-services://?action=download-manifest&url=" +
        encodeURIComponent(manifestUrl);
      const installLink = document.getElementById("installLink");

      installLink.href = installUrl;
      setTimeout(() => {
        window.location.href = installUrl;
      }, 350);
    </script>
  </body>
</html>
