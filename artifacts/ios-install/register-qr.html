<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register iPhone for RTX5</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        align-items: center;
        background: #111318;
        color: #f5f7fb;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        max-width: 460px;
        text-align: center;
      }

      h1 {
        font-size: 28px;
        letter-spacing: 0;
        margin: 0 0 18px;
      }

      img {
        background: white;
        border-radius: 8px;
        height: min(72vw, 360px);
        padding: 14px;
        width: min(72vw, 360px);
      }

      p {
        color: #b9c0cc;
        font-size: 16px;
        line-height: 1.5;
        margin: 18px auto 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Register iPhone First</h1>
      <img src="./rtx5-register-iphone-qr.svg" alt="RTX5 iPhone registration QR code" />
      <p>Scan this on the iPhone, finish the Expo device registration, then create a new iOS internal build.</p>
    </main>
  </body>
</html>
